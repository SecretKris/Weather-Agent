name: Probe stratosphere data (temporary)
on:
  push:
    paths: ["agent/probe_strat.py", ".github/workflows/probe.yml"]
permissions:
  contents: write
concurrency:
  group: probe
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python agent/probe_strat.py
      - run: |
          git config user.name "snow-agent"
          git config user.email "snow-agent@users.noreply.github.com"
          git add probe
          git commit -m "Probe result" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
